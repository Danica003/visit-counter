name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .
      
      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t visit-counter .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: visit-counter
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Start services with Docker compose
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      
      - name: Run healthcheck script
        run: ./scripts/healthcheck.sh http://localhost:8080
      
      - name: Check visit counter
        run: curl --fail http://localhost:8080/visits

      - name: Stop services
        if: always()
        run: docker compose down

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUN_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag visit-counter "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"          

      
